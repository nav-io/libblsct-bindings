name: 'Python: Publish package'

on:
  workflow_dispatch:
  push:
    paths:
      - 'ffi/blsct.i'
      - 'ffi/python/**'
      - '.github/workflows/python-publish-pkg.yml'
  pull_request:
    paths:
      - 'ffi/blsct.i'
      - 'ffi/python/**'
      - '.github/workflows/python-publish-pkg.yml'


jobs:
  build:
    strategy:
      matrix:
        os: ['ubuntu-24.04', 'macos-15', 'windows-2022']
        python-version: ['3.12']

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6
        with:
          clean: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python dependencies
        run: pip install cibuildwheel

      - name: Install system dependencies
        shell: bash
        run: |
          if [[ $RUNNER_OS == 'Linux' ]]; then
            sudo apt-get update && sudo apt-get install -y swig cmake pkg-config
          elif [[ $RUNNER_OS == 'macOS' ]]; then
            brew install swig cmake pkg-config
          elif [[ $RUNNER_OS == 'Windows' ]]; then
            # cmake + ninja ship with the runner image; swig does not
            choco install swig --no-progress -y
            swig -version
          fi

      - name: Configure MSVC developer environment (Windows)
        if: runner.os == 'Windows'
        # puts cl.exe / link.exe on PATH for the cmake -G Ninja build of
        # navio-core that setup.py drives; cibuildwheel inherits the env
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Copy shared blsct.i into python package tree
        shell: bash
        run: cp ffi/blsct.i ffi/python/blsct.i

      - name: Build wheels with cibuildwheel
        shell: bash
        run: |
          cd ffi/python
          if [ "${{ matrix.python-version }}" = "3.12" ]; then
            export CIBW_BUILD="cp312-*"
          elif [ "${{ matrix.python-version }}" = "3.13" ]; then
            export CIBW_BUILD="cp313-*"
          fi
          cibuildwheel --output-dir wheelhouse

      - name: Upload wheels artifact
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-py${{ matrix.python-version }}
          path: ffi/python/wheelhouse/*.whl

  verify:
    needs: build
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            artifact-pattern: wheels-ubuntu-24.04-*
          - os: macos-15
            artifact-pattern: wheels-macos-15-*
          - os: windows-2022
            artifact-pattern: wheels-windows-2022-*
    runs-on: ${{ matrix.os }}

    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ matrix.artifact-pattern }}
          merge-multiple: true
          path: wheelhouse

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Smoke test wheel
        shell: bash
        run: |
          pip install wheelhouse/*.whl
          python -c "from blsct import get_chain; print(get_chain())"

  publish:
    needs: verify
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: wheelhouse

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install twine
        run: pip install twine

      - name: Upload to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        # --skip-existing: lets a re-run add wheels for a new platform to an
        # already-published version instead of failing on the existing files
        run: twine upload --skip-existing wheelhouse/*.whl
